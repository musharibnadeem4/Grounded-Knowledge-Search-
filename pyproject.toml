[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drg"
version = "0.1.0"
description = "Document RAG over a manifest-listed PDF corpus"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ingest = "drg.ingest:main"
search = "drg.search:main"
ask = "drg.ask:main"

[tool.setuptools]
packages = ["drg"]
